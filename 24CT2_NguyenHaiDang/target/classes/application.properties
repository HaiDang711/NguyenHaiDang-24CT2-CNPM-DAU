spring.application.name=demo
server.port=8080

# Ket noi MySQL cua XAMPP (mac dinh root, khong mat khau).
# Dung database MOI (travel_app_java) de khong dung do voi database cua ban PHP cu.
# Neu muon dung lai database cu "travel_app", doi ten o duoi day, nhung nen sao luu truoc.
spring.datasource.url=jdbc:mysql://localhost:3306/travel_app_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Tu tao/cap nhat bang theo cac class trong model/ (khong xoa du lieu da co)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
