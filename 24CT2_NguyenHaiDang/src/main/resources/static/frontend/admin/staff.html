<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài khoản nhân viên — DangBooking Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell" id="admin-shell">
  <div class="admin-main">
    <div class="page-head">
      <div><h1>Tài khoản nhân viên</h1><p>Chỉ Admin mới cấp được tài khoản quản trị</p></div>
      <button class="btn btn-primary" id="open-create">+ Cấp tài khoản mới</button>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>Họ tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Ngày tạo</th></tr></thead>
        <tbody id="staff-rows"><tr><td colspan="4">Đang tải…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="overlay" id="create-overlay">
  <div class="modal">
    <button class="modal-close-x" id="close-create">✕</button>
    <h2>Cấp tài khoản quản trị</h2>
    <form id="create-form">
      <div class="field-block"><label>Họ và tên</label><input type="text" id="c-name" required></div>
      <div class="field-block"><label>Tên đăng nhập</label><input type="text" id="c-username" required></div>
      <div class="field-block"><label>Mật khẩu tạm</label><input type="password" id="c-pass" required minlength="6"></div>
      <div class="field-block">
        <label>Vai trò</label>
        <select id="c-role" style="width:100%; padding:11px 13px; border-radius:9px; border:1.5px solid var(--line); font-size:14.5px;">
          <option value="staff">Nhân viên</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button class="submit-btn" type="submit">Cấp tài khoản</button>
      <div class="form-error" id="c-err"></div>
    </form>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script>
async function loadStaff(){
  const rows = document.getElementById('staff-rows');
  try {
    const data = await adminGet('staff.php');
    rows.innerHTML = data.staff.map(s => `
      <tr>
        <td>${s.full_name}</td><td>${s.username}</td>
        <td><span class="badge role-${s.role}">${s.role === 'admin' ? 'Admin' : 'Nhân viên'}</span></td>
        <td>${new Date(s.created_at).toLocaleDateString('vi-VN')}</td>
      </tr>`).join('');
  } catch(e){ rows.innerHTML = `<tr><td colspan="4" style="color:#C4402E">${e.message}</td></tr>`; }
}

document.addEventListener('DOMContentLoaded', async () => {
  // requiredRoles chỉ ['admin'] -> nhân viên vào trang này sẽ thấy "Không có quyền truy cập"
  const me = await bootAdminPage('staff', ['admin']);
  if (!me) return;
  loadStaff();

  const overlay = document.getElementById('create-overlay');
  document.getElementById('open-create').addEventListener('click', () => overlay.classList.add('open'));
  document.getElementById('close-create').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.classList.remove('open'); });

  document.getElementById('create-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('c-err');
    errEl.style.display = 'none';
    try {
      await adminPost('staff.php', {
        full_name: document.getElementById('c-name').value.trim(),
        username: document.getElementById('c-username').value.trim(),
        password: document.getElementById('c-pass').value,
        role: document.getElementById('c-role').value
      });
      overlay.classList.remove('open');
      e.target.reset();
      toast('Đã cấp tài khoản mới.');
      loadStaff();
    } catch(err){ errEl.textContent = err.message; errEl.style.display = 'block'; }
  });
});
</script>
</body>
</html>
