<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — DangBooking</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="nav"><div class="logo"><span class="mark"></span> DangBooking</div></div></header>
<div class="form-wrap">
  <a class="back-link" href="index.html">← Quay lại trang chủ</a>
  <h1>Tạo tài khoản</h1>
  <div class="sub">Đăng ký để lưu chuyến đi, nhận ưu đãi và đặt chỗ nhanh hơn.</div>
  <form id="register-form">
    <div class="field-block"><label>Họ và tên</label><input type="text" id="reg-name" required></div>
    <div class="field-block">
      <label>Số điện thoại <span class="hint">(bắt buộc)</span></label>
      <div class="phone-row"><div class="code">+84</div><input type="tel" id="reg-phone" required pattern="[0-9]{9,10}" placeholder="912345678"></div>
    </div>
    <div class="field-block"><label>Email <span class="hint">(không bắt buộc)</span></label><input type="email" id="reg-email"></div>
    <div class="field-block"><label>Mật khẩu</label><input type="password" id="reg-pass" required minlength="6"></div>
    <button class="submit-btn" type="submit">Đăng ký</button>
    <div class="form-error" id="reg-error"></div>
    <div class="terms">Bằng việc đăng ký, bạn đồng ý với Điều khoản dịch vụ và Chính sách bảo mật của DangBooking.</div>
  </form>
</div>
<div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>
<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
