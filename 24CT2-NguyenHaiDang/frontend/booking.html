<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt phòng — DangBooking</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="nav">
    <div class="logo"><span class="mark"></span> DangBooking</div>
    <a class="back-link" href="#" id="back-tour" style="color:#CDEAE7; margin:0;">← Quay lại tour</a>
  </div>
</header>
<div class="form-wrap" style="max-width:760px;">
  <h1 style="font-size:28px;">Xác nhận đặt phòng</h1>
  <p class="sub" style="margin-bottom:0;">Kiểm tra lại thông tin trước khi hoàn tất.</p>
  <div class="booking-grid">
    <form id="booking-form" style="border:1px solid var(--line); border-radius:14px; padding:22px; background:var(--white);">
      <h3 style="margin-bottom:14px;">Thông tin người đặt</h3>
      <div class="field-block"><label>Họ và tên</label><input type="text" id="bk-name" required></div>
      <div class="field-block"><label>Số điện thoại</label><input type="tel" id="bk-phone" required></div>
      <div class="field-block"><label>Email</label><input type="email" id="bk-email"></div>
      <div class="field-block"><label>Ngày khởi hành</label><input type="date" id="bk-departure" required></div>
      <div class="field-block"><label>Số người đi cùng</label><input type="number" id="bk-guests" min="1" value="1" required></div>
      <div class="field-block">
        <label>Yêu cầu xe riêng <span class="hint">(không bắt buộc — để trống nếu để DangBooking sắp xếp xe phù hợp)</span></label>
        <input type="text" id="bk-vehicle" placeholder="VD: xe 16 chỗ riêng cho đoàn công ty">
      </div>
      <h3 style="margin:18px 0 10px;">Phương thức thanh toán</h3>
      <div class="pay-options">
        <label class="pay-opt"><input type="radio" name="pay" value="Thanh toán khi nhận phòng" checked> Thanh toán khi nhận phòng</label>
        <label class="pay-opt"><input type="radio" name="pay" value="VNPay"> VNPay</label>
        <label class="pay-opt"><input type="radio" name="pay" value="Momo"> Momo</label>
      </div>
      <button class="submit-btn gold" type="submit">Xác nhận đặt phòng</button>
      <div class="form-error" id="bk-error"></div>
    </form>
    <div class="side-card">
      <div style="font-weight:800; font-size:15.5px;" id="sum-tour">—</div>
      <div style="font-size:13.5px; color:var(--ink-600); margin:3px 0 14px;" id="sum-package">—</div>
      <div class="side-row"><span>Ngày khởi hành</span><span id="sum-departure">—</span></div>
      <div class="side-row"><span>Số người</span><span id="sum-guests">—</span></div>
      <div class="side-row total"><span>Tổng cộng</span><span id="sum-total">—</span></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>
<script src="js/api.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
