<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn đặt tour — DangBooking Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<style>
  .vehicle-cell{ min-width:220px; }
  .vehicle-suggest{ font-size:12px; color:var(--ink-600); margin-bottom:6px; line-height:1.4; }
  .vehicle-input{ width:100%; padding:7px 9px; border-radius:7px; border:1.5px solid var(--line); font-size:13px; font-family:inherit; }
  .vehicle-final{ font-size:13.5px; font-weight:700; color:var(--ocean-800); }
  .badge.cancel_requested{ background:#FDE8D6; color:#B4551A; }
  .cancel-note{ font-size:12px; color:var(--ink-600); margin-top:4px; font-style:italic; }
  .badge.paid{ background:var(--lagoon-100); color:var(--ocean-800); }
  .badge.unpaid{ background:#F1EFE6; color:var(--ink-600); }
</style>
</head>
<body>
<div class="admin-shell" id="admin-shell">
  <div class="admin-main">
    <div class="page-head">
      <div><h1>Đơn đặt tour</h1><p>Duyệt/hủy đơn, xử lý yêu cầu hủy-đổi từ khách, kiểm tra gợi ý xe trước khi duyệt</p></div>
    </div>
    <div class="table-card">
      <table>
        <thead><tr>
          <th>Mã đơn</th><th>Khách hàng</th><th>Tour</th><th>Khởi hành</th><th>Số khách</th><th>Phương tiện</th><th>Thanh toán</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thao tác</th>
        </tr></thead>
        <tbody id="booking-rows"><tr><td colspan="10">Đang tải…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="js/admin-common.js"></script>
<script>
const statusLabel = {
  pending: 'Chờ duyệt',
  confirmed: 'Đã duyệt',
  cancelled: 'Đã hủy',
  cancel_requested: 'Khách yêu cầu hủy/đổi'
};
const paymentLabel = { paid: 'Đã thanh toán', unpaid: 'Chưa thanh toán' };

async function loadBookings(){
  const rows = document.getElementById('booking-rows');
  try {
    const data = await adminGet('bookings.php');
    if (!data.bookings.length){ rows.innerHTML = '<tr><td colspan="10">Chưa có đơn nào.</td></tr>'; return; }
    rows.innerHTML = data.bookings.map(b => `
      <tr>
        <td><b>${b.booking_code}</b></td>
        <td>${b.guest_name}<br><span style="color:var(--ink-600); font-size:12.5px;">${b.guest_phone}</span></td>
        <td>${b.tour_name}<br><span style="color:var(--ink-600); font-size:12.5px;">${b.package_name}</span></td>
        <td>${b.departure_date ? new Date(b.departure_date).toLocaleDateString('vi-VN') : '—'}</td>
        <td style="text-align:center; font-weight:700;">${b.guest_count}</td>
        <td class="vehicle-cell">
          ${b.status === 'pending' ? `
            <div class="vehicle-suggest">💡 Gợi ý: ${b.suggested_vehicle}</div>
            <input type="text" class="vehicle-input" data-vehicle-for="${b.id}" value="${(b.assigned_vehicle || '').replace(/"/g,'&quot;')}" placeholder="Nhập xe sẽ dùng rồi bấm Duyệt">
          ` : `<span class="vehicle-final">${b.assigned_vehicle || b.suggested_vehicle}</span>`}
        </td>
        <td><span class="badge ${b.payment_status}">${paymentLabel[b.payment_status]}</span></td>
        <td>${moneyVN(b.total_price)}</td>
        <td>
          <span class="badge ${b.status}">${statusLabel[b.status]}</span>
          ${b.status === 'cancel_requested' && b.cancel_reason ? `<div class="cancel-note">Lý do: ${b.cancel_reason}</div>` : ''}
        </td>
        <td>
          <div class="row-actions">
            ${b.status === 'pending' ? `
              <button class="mini-btn approve" data-id="${b.id}" data-action="confirm">Duyệt</button>
              <button class="mini-btn cancel" data-id="${b.id}" data-action="cancel">Hủy</button>` : ''}
            ${b.status === 'cancel_requested' ? `
              <button class="mini-btn cancel" data-id="${b.id}" data-action="cancel">Đồng ý hủy</button>
              <button class="mini-btn approve" data-id="${b.id}" data-action="reject_cancel">Từ chối</button>` : ''}
            ${b.status !== 'pending' && b.status !== 'cancel_requested' ? '—' : ''}
          </div>
        </td>
      </tr>`).join('');

    rows.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const vehicleInput = document.querySelector(`input[data-vehicle-for="${btn.dataset.id}"]`);
        try {
          await adminPost('bookings.php', {
            id: btn.dataset.id,
            action: btn.dataset.action,
            assigned_vehicle: vehicleInput ? vehicleInput.value.trim() : ''
          });
          const msg = {
            confirm: 'Đã duyệt đơn.', cancel: 'Đã hủy đơn.', reject_cancel: 'Đã từ chối yêu cầu hủy/đổi.'
          }[btn.dataset.action];
          toast(msg);
          loadBookings();
        } catch(e){ toast(e.message); }
      });
    });
  } catch(e){ rows.innerHTML = `<tr><td colspan="10" style="color:#C4402E">${e.message}</td></tr>`; }
}

document.addEventListener('DOMContentLoaded', async () => {
  const me = await bootAdminPage('bookings');
  if (!me) return;
  loadBookings();
});
</script>
</body>
</html>
